<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .nav-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            background-color: #4CAF50;
            padding: 15px;
            color: #fff;
            position: absolute;
            top: 0;
        }
        .nav-bar a {
            margin: 0 10px;
            text-decoration: none;
            color: #fff;
        }
        .login-container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }
        .login-container h1 {
            margin-bottom: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            text-align: left;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: calc(100% - 22px);
        }
        button {
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        button[type="submit"] {
            background-color: #4CAF50;
            color: #fff;
        }
        button[type="reset"] {
            background-color: #f44336;
            color: #fff;
        }
        .error {
            color: red;
            margin-top: -10px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    {% if user.is_authenticated %}
    <div class="nav-bar">
        <span>Welcome, {{ user.username }}</span>
        <div>
            <a href="{% url 'Customer' %}">User Manage</a>
            <a href="{% url 'customer_logout' %}">Logout</a>
        </div>
    </div>
    {% endif %}
    <div class="login-container">
        <h1>Customer Login</h1>
        <form onsubmit="return confirm('Are you sure you want to log in as Customer?');" method="post" action="{% url 'customer_login' %}">
            {% csrf_token %}
            <fieldset>
                <legend>Login</legend>
                <label for="email">Email login:</label>
                <input type="email" name="login" id="email" placeholder="Your email" required>
                <label for="passwd">Password:</label>
                <input type="password" id="passwd" name="passwd" placeholder="Your password" pattern=".{8,}" title="Need more than 7 characters" required>
                <button type="submit">Login</button>
                <button type="reset">Clear</button>
            </fieldset>
            {% if error %}
            <p class="error">{{ error }}</p>
            {% endif %}
        </form>
    </div>
</body>
</html>
